{% extends 'base.html' %}{% block title %}MediKiosk • Reset{% endblock %}{% block content %}<section class="center-page"><div class="auth-card"><span class="eyebrow">ACCOUNT RECOVERY</span><h1>Reset password</h1><label>Email<input id="email" type="email"></label><button class="secondary big full" onclick="sendReset()">Send OTP</button><label>OTP<input id="otp" maxlength="6"></label><label>New password<input id="pass" type="password"></label><button class="primary big full" onclick="resetPassword()">Reset password</button><p id="msg" class="error"></p><a class="link-btn" href="/auth">Back</a></div></section>{% endblock %}{% block scripts %}<script>async function sendReset(){let r=await api('/api/auth/forgot-password/send-otp','POST',{email:email.value});msg.textContent=r.dev_otp?'Development OTP: '+r.dev_otp:(r.message||r.error)}async function resetPassword(){let r=await api('/api/auth/forgot-password/reset','POST',{email:email.value,otp:otp.value,new_password:pass.value});msg.textContent=r.message||r.error;if(r.success)setTimeout(()=>location.href='/auth',800)}</script>{% endblock %}
