{% extends "base.html" %}{% block title %}MediKiosk • Create account{% endblock %}{% block content %}<div class="auth-wrap"><section class="card auth-card"><span class="eyebrow">NEW PATIENT</span><h1>Create your account</h1><p class="muted">Use an email you can access. The prototype OTP flow verifies the address before registration.</p><label>Full name<input id="name" placeholder="Full name"></label><label>Email<input id="email" type="email" placeholder="you@example.com"></label><button class="btn" onclick="sendOtp()">Send OTP</button><p id="otpMsg" class="small"></p><label>OTP<input id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit OTP"></label><button class="btn" onclick="verifyOtp()">Verify OTP</button><label>Password<input id="password" type="password" placeholder="Create a password"></label><button class="btn primary full" onclick="registerUser()">Create patient account</button><p id="msg" class="danger-text small"></p><div class="actions"><a class="btn" href="/login">Back to sign in</a></div></section></div>{% endblock %}{% block scripts %}<script>async function sendOtp(){let r=await api('/api/auth/register/send-otp','POST',{email:email.value,purpose:'register'});otpMsg.textContent=r.success?(r.dev_otp?'Development OTP: '+r.dev_otp:'OTP sent'):r.error||'Unable to send OTP'}async function verifyOtp(){let r=await api('/api/auth/register/verify-otp','POST',{email:email.value,purpose:'register',otp:otp.value});otpMsg.textContent=r.success?'OTP verified':'OTP not verified'}async function registerUser(){let r=await api('/api/auth/register','POST',{full_name:name.value,email:email.value,password:password.value,otp:otp.value});if(!r.success){msg.textContent=r.error||'Registration failed';return}saveAuth(r);location.href='/patient'}</script>{% endblock %}
