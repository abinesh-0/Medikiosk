{% extends "base.html" %}{% block title %}MediKiosk • Reset password{% endblock %}{% block content %}<div class="auth-wrap"><section class="card auth-card"><span class="eyebrow">ACCOUNT RECOVERY</span><h1>Reset password</h1><p class="muted">Verify your email with the OTP, then choose a new password.</p><label>Email<input id="email" type="email"></label><button class="btn" onclick="sendOtp()">Send reset OTP</button><p id="otpMsg" class="small"></p><label>OTP<input id="otp" inputmode="numeric" maxlength="6"></label><label>New password<input id="password" type="password"></label><button class="btn primary full" onclick="resetPw()">Reset password</button><p id="msg" class="danger-text small"></p><a class="btn" href="/login">Back to sign in</a></section></div>{% endblock %}{% block scripts %}<script>async function sendOtp(){let r=await api('/api/auth/forgot-password/send-otp','POST',{email:email.value,purpose:'reset'});otpMsg.textContent=r.success?(r.dev_otp?'Development OTP: '+r.dev_otp:'OTP sent'):r.error||'Unable to send OTP'}async function resetPw(){let r=await api('/api/auth/forgot-password/reset','POST',{email:email.value,otp:otp.value,new_password:password.value});msg.textContent=r.success?'Password reset successfully':r.error||'Unable to reset password'}</script>{% endblock %}
